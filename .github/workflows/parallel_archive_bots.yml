name: SijjMoviesHub 8-Bot Cluster

on:
  workflow_dispatch: # Manual start button ke liye
  schedule:
    - cron: '*/30 * * * *' # Har 30 minute baad auto-run karne ke liye (Aap isay badal sakte hain)

jobs:
  run-bots:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bot_id: [1, 2, 3, 4, 5, 6, 7, 8]
      fail-fast: false # Bohat zaroori: Agar ek bot ruke toh baqi 7 apna kaam karte rahein!

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Aria2 for High Speed)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get clean
          # Agar GitHub ka server down bhi ho toh error ignore kar ke aagay barh jaye (|| true)
          sudo apt-get update -qq -y || true
          sudo apt-get install -yqq aria2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests internetarchive

      - name: Run Archive Bot Instance
        env:
          BOT_ID: ${{ matrix.bot_id }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          # 4 Accounts ki keys
          IA_ACCESS_1: ${{ secrets.IA_ACCESS_1 }}
          IA_SECRET_1: ${{ secrets.IA_SECRET_1 }}
          IA_ACCESS_2: ${{ secrets.IA_ACCESS_2 }}
          IA_SECRET_2: ${{ secrets.IA_SECRET_2 }}
          IA_ACCESS_3: ${{ secrets.IA_ACCESS_3 }}
          IA_SECRET_3: ${{ secrets.IA_SECRET_3 }}
          IA_ACCESS_4: ${{ secrets.IA_ACCESS_4 }}
          IA_SECRET_4: ${{ secrets.IA_SECRET_4 }}
        run: python archive_bot.py
