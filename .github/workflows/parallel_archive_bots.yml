name: SijjMoviesHub Hybrid Auto-Scraper

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 */4 * * *' 

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bot_id: [1, 2, 3, 4, 5, 6, 7, 8] 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          # aria2 torrents aur direct downloads dono ke liye best aur fast hai
          sudo apt-get install -y aria2 ffmpeg

      - name: Run Hybrid Scraper Bot
        run: python archive_bot.py
        env:
          BOT_ID: ${{ matrix.bot_id }}
          YEAR_START: "2025"
          YEAR_END: "2026"
          IA_ACCESS: ${{ secrets.IA_ACCESS }}
          IA_SECRET: ${{ secrets.IA_SECRET }}
