name: SijjMoviesHub Telegram Auto-Scraper

on:
  workflow_dispatch: # Manual run ke liye
  schedule:
    - cron: '0 */4 * * *' # Har 4 ghante baad khud chalega

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bot_id: [1, 2, 3] # Ek sath 3 bots alag-alag movies par kaam karenge

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Stable version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg # Video duration/size check karne ke liye

      - name: Run Telegram Scraper Bot
        run: python archive_bot.py
        env:
          # --- Aapki Purani Settings ---
          BOT_ID: ${{ matrix.bot_id }}
          YEAR_START: "2025"
          YEAR_END: "2026"
          IA_ACCESS: ${{ secrets.IA_ACCESS }}
          IA_SECRET: ${{ secrets.IA_SECRET }}
          
          # --- Naye Telegram Secrets ---
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
