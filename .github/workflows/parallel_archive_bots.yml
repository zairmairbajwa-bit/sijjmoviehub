name: SijjMoviesHub Auto Bots

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'  # Har 30 minute baad auto chalega (Aap isay marzi se change kar sakte hain)

jobs:
  run-bots:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bot_id: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (aria2)
        run: sudo apt-get install -y aria2

      - name: Install Python Dependencies
        run: pip install requests internetarchive

      - name: Run Bot ${{ matrix.bot_id }}
        env:
          BOT_ID: ${{ matrix.bot_id }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          IA_ACCESS_1: ${{ secrets.IA_ACCESS_1 }}
          IA_SECRET_1: ${{ secrets.IA_SECRET_1 }}
          IA_ACCESS_2: ${{ secrets.IA_ACCESS_2 }}
          IA_SECRET_2: ${{ secrets.IA_SECRET_2 }}
          IA_ACCESS_3: ${{ secrets.IA_ACCESS_3 }}
          IA_SECRET_3: ${{ secrets.IA_SECRET_3 }}
          IA_ACCESS_4: ${{ secrets.IA_ACCESS_4 }}
          IA_SECRET_4: ${{ secrets.IA_SECRET_4 }}
          IA_ACCESS_5: ${{ secrets.IA_ACCESS_5 }}
          IA_SECRET_5: ${{ secrets.IA_SECRET_5 }}
          IA_ACCESS_6: ${{ secrets.IA_ACCESS_6 }}
          IA_SECRET_6: ${{ secrets.IA_SECRET_6 }}
          IA_ACCESS_7: ${{ secrets.IA_ACCESS_7 }}
          IA_SECRET_7: ${{ secrets.IA_SECRET_7 }}
        run: python archive_bot.py
