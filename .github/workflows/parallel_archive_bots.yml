name: SijjMoviesHub Mp4moviez Scraper

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 */4 * * *' 

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bot_id: [1, 2, 3, 4] # Pehle 4 bots test karenge

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Run Playwright Bot
        run: python mp4moviez_bot.py
        env:
          BOT_ID: ${{ matrix.bot_id }}
          IA_ACCESS: ${{ secrets.IA_ACCESS }}
          IA_SECRET: ${{ secrets.IA_SECRET }}
