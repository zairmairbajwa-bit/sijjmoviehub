name: SijjMoviesHub Telegram Auto-Scraper

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 */4 * * *' 

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Yahan humne 8 bots lagaye hain jo ek sath 8 alag servers par chalenge
      matrix:
        bot_id: [1, 2, 3, 4, 5, 6, 7, 8] 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Telegram Scraper Bot
        run: python archive_bot.py
        env:
          BOT_ID: ${{ matrix.bot_id }}
          YEAR_START: "2025"
          YEAR_END: "2026"
          IA_ACCESS: ${{ secrets.IA_ACCESS }}
          IA_SECRET: ${{ secrets.IA_SECRET }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
