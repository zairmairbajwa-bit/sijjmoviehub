name: Movie Scraper Bot

on:
  schedule:
    - cron: '0 */4 * * *' # Yeh har 4 ghante baad automatically chalega
  workflow_dispatch: # Isse aap jab chahen manually button daba kar bhi run kar sakte hain

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install cloudscraper beautifulsoup4 requests

      - name: Run Scraper Script
        run: |
          python scraper.py
